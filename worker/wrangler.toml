name = "monkey-bomb-signal"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# Browser origins allowed to call this Worker (comma-separated, exact match, no wildcard).
# An empty or missing value allows no browser origin at all.
# This default is for local development and `vite preview` only. The owner sets the production
# value before deploying: the Pages domain of the site, plus `capacitor://localhost` and
# `https://localhost` once the store apps exist (e.g. `wrangler deploy --var ALLOWED_ORIGINS:...`).
# A plain `wrangler deploy` resets the value to THIS list: pass --var on every production deploy.
# Do not commit a real domain or any secret here.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RateLimiter"]
